[versions]
agp = "9.3.0"
colorpicker = "1.0.0"
kotlin = "2.4.10"
ktor = "3.5.1"
junit = "4.13.2"
composeBom = "2026.06.01"
composeMaterial = "1.6.2"
composeFoundation = "1.6.2"
